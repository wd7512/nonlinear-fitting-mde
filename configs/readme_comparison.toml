# Shared Python/SciPy and Rust comparison used by the README.
# 3 equation families x 4 parameter counts x 2 starts = 24 fits per solver.
name = "readme_comparison"
seed = 42
solvers = ["lbfgs", "lm", "trf"]
budgets_ms = [1, 5, 10, 25, 100]
targets = [1e-6]
worker_deadline_s = 30
watchdog_s = 45

[[datasets]]
kind = "synthetic"
name = "synthetic"
families = ["exp_mixture", "sin_mixture", "coupled_tanh"]
param_counts = [2, 8, 32, 96]
near_scale = 0.05

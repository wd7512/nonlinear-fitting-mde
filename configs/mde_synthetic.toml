# The original minimum decisive experiment (docs/MDE.md): 3 families x 4 sizes x
# near/far starts x 6 solvers = 144 fits, 25 ms each, single thread.
name = "mde_synthetic"
seed = 42
solvers = ["adam", "lbfgs", "gauss_newton", "lm", "trf", "varpro_lm"]
budgets_ms = [1, 5, 10, 25]
targets = [1e-6, 1e-10]
worker_deadline_s = 7.5
watchdog_s = 9.0

[[datasets]]
kind = "synthetic"
name = "synthetic"
families = ["exp_mixture", "sin_mixture", "coupled_tanh"]
param_counts = [2, 8, 32, 96]
near_scale = 0.05

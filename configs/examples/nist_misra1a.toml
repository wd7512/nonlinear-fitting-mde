# NIST StRD Misra1a with its two official starts and certified minimum.
name = "nist_misra1a"
budgets_ms = [1, 5, 10, 25]
targets = [1e-6, 1e-10]

[[datasets]]
kind = "table"
name = "misra1a"
path = "data/examples/misra1a.csv"
read_options = { comment = "#" }
x = "x"
y = "y"
reference = "given"

[[datasets.models]]
name = "misra1a"
expr = "b1 * (1 - exp(-b2 * x))"
params = ["b1", "b2"]
starts.values = { start1 = [500, 1e-4], start2 = [250, 5e-4] }
reference.sse = 1.2455138894e-01  # certified residual sum of squares

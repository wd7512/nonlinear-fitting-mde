# Many noisy curves (long layout with a curve id and per-point sigma) scored with a
# correct and an incorrect candidate equation: the symbolic-regression use case.
# No known minimum, so success = reaching the best loss any solver found.
name = "damped_curves"
budgets_ms = [1, 5, 10, 25]
targets = [1e-6, 1e-10]
worker_deadline_s = 15
watchdog_s = 20

[[datasets]]
kind = "table"
name = "damped"
path = "data/examples/damped_curves.csv"
x = "x"
y = "y"
curve = "curve"
sigma = "sigma"
reference = "best_found"

[[datasets.models]]
name = "damped_cos"  # true form; A and c are conditionally linear (VarPro eliminates them)
expr = "A * exp(-k * x) * cos(w * x) + c"
params = ["A", "k", "w", "c"]
starts.bounds = { A = [0.5, 2.5], k = [0.05, 1.5], w = [1.0, 6.0], c = [-0.5, 0.5] }
starts.n_random = 2

[[datasets.models]]
name = "exp_decay"  # misspecified candidate
expr = "A * exp(-k * x) + c"
params = ["A", "k", "c"]
starts.bounds = { A = [0.5, 2.5], k = [0.05, 1.5], c = [-0.5, 0.5] }
starts.n_random = 2

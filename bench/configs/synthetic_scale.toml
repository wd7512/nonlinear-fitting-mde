# custom synthetic equations scaled to p = 99 and ~1,000 curves
# (3 families x 5 sizes x 67 curves = 1,005 curves; 2 starts each).
name = "synthetic_scale"
budgets_ms = [1, 5, 10, 25]
targets = [1e-6, 1e-10]
worker_deadline_s = 900
watchdog_s = 1000

[[datasets]]
kind = "synthetic"
name = "scale"
families = ["exp_mixture", "sin_mixture", "coupled_tanh"]
param_counts = [2, 8, 32, 64, 99]
n_curves = 67

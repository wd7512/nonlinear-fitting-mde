# NIST StRD nonlinear regression (27 problems x 2 official starts).
# Certified numerical accuracy: relative success on the loss plus parameter LRE.
# Data: uv run python -m bench.fetch nist
name = "nist_strd"
budgets_ms = [1, 5, 10, 25]
targets = [1e-6, 1e-10]
success = "relative"        # L - R <= target * max(R, floor)
relative_floor = 1e-16      # normalised loss; leaves room for float64 round-off
worker_deadline_s = 60
watchdog_s = 90

[[datasets]]
kind = "nist"
path = "data/external/nist"
reference = "certified"

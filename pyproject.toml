[project]
name = "symbolic-regression-rust"
version = "0.1.0"
description = "Benchmark nonlinear least-squares optimisers on millisecond CPU budgets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Dennis" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "threadpoolctl>=3.5",
    "pandas>=2.2",
    "tabulate>=0.9",
    "matplotlib>=3.9",
    "sympy>=1.13",
    "pydantic>=2.7",
]

[project.urls]
Repository = "https://github.com/wd7512/symbolic-regression-rust"

[project.scripts]
symreg-rs = "symbolic_regression_rust.cli:main"

[project.optional-dependencies]
parquet = [
    "pyarrow>=16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["symbolic_regression_rust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["uv_build>=0.8,<0.14.0"]
build-backend = "uv_build"

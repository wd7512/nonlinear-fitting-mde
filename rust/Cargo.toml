[package]
name = "symbfitrs"
version = "0.1.0"
edition = "2021"
description = "Fast nonlinear least-squares fitter (variable projection + LM)"
license = "MIT"
publish = false

[lib]
name = "symbfitrs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "symbfitrs-bench"
path = "src/main.rs"
required-features = ["bench"]

[features]
default = ["bench"]
# the Python extension module (built by maturin, see pyproject.toml)
python = ["dep:pyo3"]
# symbfitrs-bench and its varpro-crate baseline; varpro 0.14 is built on nalgebra 0.34
bench = ["dep:varpro", "dep:nalgebra034"]

[dependencies]
nalgebra = "0.35"
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"], optional = true }
varpro = { version = "0.14", optional = true }
nalgebra034 = { package = "nalgebra", version = "0.34", optional = true }
serde_json = "1"
libm = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "unwind"

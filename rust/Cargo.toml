[package]
name = "nlfit-core"
version = "0.1.0"
edition = "2021"
description = "Single-threaded nonlinear least-squares optimiser (VarPro + LM) for symbolic-regression-rust"
license = "MIT"
publish = false

[lib]
name = "nlfit_core"
path = "src/lib.rs"

[[bin]]
name = "nlfit-rs"
path = "src/main.rs"

[dependencies]
nalgebra = "0.35"
serde_json = "1"
libm = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "unwind"

[package]
name = "symbfitrs"
version = "0.1.0"
edition = "2021"
description = "Fast nonlinear least-squares fitter (variable projection + LM)"
license = "MIT"
publish = false

[lib]
name = "symbfitrs"
path = "src/lib.rs"

[[bin]]
name = "symbfitrs-bench"
path = "src/main.rs"

[dependencies]
nalgebra = "0.35"
# baseline only (symbfitrs-bench --solvers varpro_rs); varpro 0.14 is built on nalgebra 0.34
varpro = "0.14"
nalgebra034 = { package = "nalgebra", version = "0.34" }
serde_json = "1"
libm = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "unwind"

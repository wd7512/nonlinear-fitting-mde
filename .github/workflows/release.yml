name: Wheels

# Builds wheels on every PR that touches the package; on a v* tag, publishes to PyPI (trusted
# publishing: the "pypi" environment, no token) and creates the GitHub release. See
# docs/releasing.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["rust/**", "python/**", "pyproject.toml", ".github/workflows/release.yml"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, smoke: true }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64, smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - if: matrix.smoke
        uses: astral-sh/setup-uv@v6
      - if: matrix.smoke
        name: install the wheel into a clean environment and fit
        run: |
          uv venv /tmp/smoke --python 3.10
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "
          import numpy as np, symbfitrs as sf
          x = np.linspace(0, 5, 50)
          r = sf.compile('a*exp(-b*x) + c').fit(x, 2*np.exp(-0.7*x) + 0.3, budget_ms=50)
          assert r.success and abs(r['b'] - 0.7) < 1e-8, r
          print(r)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/symbfitrs/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 .github/version.py)"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: python3 .github/version.py --notes > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv run python -m bench run quick --no-plot
      - run: uv run python -m bench run quick --fitter --no-plot

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --manifest-path rust/Cargo.toml

  # release PRs (dev -> main, or a hotfix): changelog section, versions agree, tag is new
  release:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version, changelog and tag
        run: |
          python3 .github/version.py --notes > /dev/null
          v=$(python3 .github/version.py)
          if git ls-remote --exit-code --tags origin "v$v" > /dev/null; then
            echo "tag v$v already exists: bump the version"; exit 1
          fi
